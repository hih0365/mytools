<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools</title>
<style>
  :root{
    --bg: #f7f9fa;
    --panel: #ffffff;
    --line: #e2e8ec;
    --text: #1c2733;
    --dim: #6b7c88;
    --accent: #1a9c74;
    --accent2: #2f6fd6;
    --accent3: #9b59b6;
    --accent4: #e8c84a
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(26,156,116,0.06), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(47,111,214,0.06), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 20px;
  }
  .eyebrow{
    letter-spacing: 3px;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 48px;
  }
  .editable-line{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap: 6px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 640px; /* 카드가 3개가 되면 자동으로 줄바꿈되거나 폭을 넓게 차지하게 됩니다 */
  }
  .card{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px;
    text-decoration:none;
    color: var(--text);
    display:flex;
    flex-direction:column;
    gap: 10px;
    overflow:hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width: 4px; height:100%;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform .3s ease;
  }
  .card.blue::before{ background: var(--accent2); }
  .card.purple::before{ background: var(--accent3); }
  .card.purple .arrow{ color: var(--accent3); }
  .card.yellow::before{ background: var(--accent4); }
  .card.yellow .arrow{ color: var(--accent4); }
  .card:hover{
    transform: translateY(-4px);
    border-color: var(--line);
    box-shadow: 0 14px 30px rgba(28,39,51,0.10);
  }
  .card:hover::before{ transform: scaleY(1); }
  .card:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  
  /* 항목 추가 버튼 (점선 카드) 스타일 */
  .card.add-card {
    border: 2px dashed #c7d1d8;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--dim);
    cursor: pointer;
    box-shadow: none;
    min-height: 160px;
  }
  .card.add-card:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(26,156,116,0.03);
    transform: translateY(-2px);
  }
  .card.add-card::before { display: none; }

  .tag{
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .name{
    font-size: 22px;
    font-weight: 700;
  }
  .desc{
    font-size: 13px;
    color: var(--dim);
    line-height: 1.5;
  }
  .arrow{
    margin-top: 8px;
    font-size: 13px;
    color: var(--accent);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .card.blue .arrow{ color: var(--accent2); }
  .arrow svg{ transition: transform .25s ease; }
  .card:hover .arrow svg{ transform: translateX(4px); }
  footer{
    margin-top: 48px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  .card-edit{
    position:absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    opacity: 0.7;
    z-index: 5;
    transition: opacity .15s ease, color .15s ease, border-color .15s ease;
  }
  .card-edit:hover{ opacity: 1; color: var(--text); border-color: #c7d1d8; }
  .card-edit svg{ width:13px; height:13px; }

  .line-edit{
    width: 20px;
    height: 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    opacity: 0.55;
    flex: none;
    transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .line-edit:hover{ opacity: 1; background: rgba(28,39,51,0.08); color: var(--text); }
  .line-edit svg{ width:12px; height:12px; }

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(20,28,34,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    padding: 24px;
  }
  .modal-overlay.open{ opacity: 1; pointer-events: auto; }
  .modal{
    background: var(--panel);
    border-radius: 16px;
    padding: 24px;
    width: min(420px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(20,28,34,0.3);
    transform: translateY(8px);
    transition: transform .18s ease;
  }
  .modal-overlay.open .modal{ transform: translateY(0); }
  .modal-title{
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 18px;
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display:block;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 5px;
  }
  .field input, .field textarea{
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #fbfcfd;
  }
  .field input:focus, .field textarea:focus{
    outline: none;
    border-color: var(--accent);
  }
  .field textarea{ resize: vertical; min-height: 54px; }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-btn{
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
  }
  .modal-btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .modal-btn:hover{ filter: brightness(0.97); }

  /* 관리자 로그인 전에는 편집 아이콘/추가 버튼을 숨김 */
  .card-edit, .line-edit { display: none; }
  .add-card { display: none !important; }
  body.admin-mode .card-edit { display: flex; }
  body.admin-mode .line-edit { display: flex; }
  body.admin-mode .add-card { display: flex !important; }

  /* 상단 우측 로그인/관리자 표시 영역 */
  #authBar{
    position: fixed;
    top: 16px;
    right: 18px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #googleLoginBtn{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(28,39,51,0.06);
  }
  #googleLoginBtn:hover{ border-color: var(--accent); color: var(--accent); }
  #googleLoginBtn:disabled{ opacity: 0.6; cursor: default; }
  #userBadge{
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 2px 8px rgba(28,39,51,0.06);
    font-size: 12px;
    color: var(--dim);
  }
  #userBadgeEmail{ font-weight: 600; color: var(--text); }
  #logoutBtn{
    border: none;
    background: rgba(28,39,51,0.06);
    color: var(--dim);
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  #logoutBtn:hover{ background: rgba(28,39,51,0.12); color: var(--text); }
</style>
</head>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script>
    (function(){
      var grid = document.getElementById('cardGrid');
      var addCardBtn = document.getElementById('addCardBtn');
      var totalCards = 4; // 기본 카드 개수 (일정관리, 계정관리, 금융정보, 부동산 관리)

      // 텍스트를 담는 요소를 가져오는 헬퍼 함수
      function getTextEl(key){
        return document.querySelector('[data-key="' + key + '"]');
      }

      // 페이지에 원래 하드코딩되어 있던 기본 상태를 스냅샷으로 저장 (로그아웃/비관리자 상태 복원용)
      var DEFAULT_GRID_HTML = grid.innerHTML;
      var DEFAULT_TOTAL_CARDS = totalCards;
      var DEFAULT_EYEBROW = getTextEl('eyebrow').textContent;
      var DEFAULT_TITLE = getTextEl('title').textContent;
      var DEFAULT_FOOTER = getTextEl('footer').textContent;

      // 새 카드 HTML 구조 생성 함수
      function createCardElement(id) {
        var a = document.createElement('a');
        a.className = 'card';
        a.id = 'cardLink' + id;
        a.href = '#';
        a.target = '_blank';
        a.rel = 'noopener';
        
        a.innerHTML = `
          <button class="card-edit" type="button" data-target="card" data-card="${id}" aria-label="카드 편집">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <div class="tag" data-key="tag${id}">NEW</div>
          <div class="name" data-key="name${id}">새 바로가기</div>
          <div class="desc" data-key="desc${id}">새로운 도구 설명을 입력하세요.</div>
          <div class="arrow"><span data-key="arrow${id}">바로가기</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M13 5l7 7-7 7"/>
            </svg>
          </div>
        `;
        return a;
      }

      // 새 항목 추가 버튼에 클릭 이벤트를 (재)연결. grid.innerHTML을 새로 그릴 때마다 다시 호출해야 함
      function bindAddCardBtn(){
        addCardBtn = document.getElementById('addCardBtn');
        addCardBtn.addEventListener('click', function(e){
          e.preventDefault();
          if(!isAdmin()) return;
          totalCards++;
          fsSave({ 'cardCount': totalCards });
          var newCard = createCardElement(totalCards);
          grid.insertBefore(newCard, addCardBtn);
          currentCard = totalCards;
          cardTitle.textContent = '새 카드 추가';
          cardTag.value = 'NEW';
          cardName.value = '새 바로가기';
          cardDesc.value = '새로운 도구 설명을 입력하세요.';
          cardArrow.value = '바로가기';
          cardUrl.value = '';
          cardOverlay.classList.add('open');
          cardTag.focus();
        });
      }

      // 코드에 저장된 기본 상태로 되돌림 (로그아웃 시 / 관리자가 아닐 때)
      function resetToDefaults(){
        grid.innerHTML = DEFAULT_GRID_HTML;
        totalCards = DEFAULT_TOTAL_CARDS;
        bindAddCardBtn();
        getTextEl('eyebrow').textContent = DEFAULT_EYEBROW;
        getTextEl('title').textContent = DEFAULT_TITLE;
        getTextEl('footer').textContent = DEFAULT_FOOTER;
      }

      /* ---------------- 단일 문구 편집 로직 ---------------- */
      var lineOverlay = document.getElementById('lineModalOverlay');
      var lineTitle = document.getElementById('lineModalTitle');
      var lineInput = document.getElementById('lineModalInput');
      var lineSave = document.getElementById('lineModalSave');
      var lineCancel = document.getElementById('lineModalCancel');
      var currentLineKey = null;

      document.querySelectorAll('.line-edit').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          if(!isAdmin()) return;
          currentLineKey = btn.getAttribute('data-target-key');
          lineTitle.textContent = btn.getAttribute('data-label') + ' 수정';
          lineInput.value = getTextEl(currentLineKey).textContent;
          lineOverlay.classList.add('open');
          lineInput.focus();
        });
      });

      function closeLineModal(){ lineOverlay.classList.remove('open'); currentLineKey = null; }
      lineCancel.addEventListener('click', closeLineModal);
      lineSave.addEventListener('click', function(){
        if(!isAdmin() || !currentLineKey) return;
        var value = lineInput.value.trim();
        if(value.length === 0) return;
        getTextEl(currentLineKey).textContent = value;
        var map = {}; map[currentLineKey] = value; fsSave(map);
        closeLineModal();
      });
      lineOverlay.addEventListener('click', function(e){ if(e.target === lineOverlay) closeLineModal(); });


      /* ---------------- 카드 추가 및 편집 로직 ---------------- */
      var cardOverlay = document.getElementById('cardModalOverlay');
      var cardTitle = document.getElementById('cardModalTitle');
      var cardTag = document.getElementById('cardTag');
      var cardName = document.getElementById('cardName');
      var cardDesc = document.getElementById('cardDesc');
      var cardArrow = document.getElementById('cardArrow');
      var cardUrl = document.getElementById('cardUrl');
      var cardSave = document.getElementById('cardModalSave');
      var cardCancel = document.getElementById('cardModalCancel');
      var currentCard = null;

      // 새 항목 추가 버튼 초기 바인딩
      bindAddCardBtn();

      // 이벤트 위임(Event Delegation)을 통한 편집 버튼 클릭 감지 (동적 생성 카드 대응)
      grid.addEventListener('click', function(e){
        var editBtn = e.target.closest('.card-edit');
        if(editBtn){
          e.preventDefault();
          e.stopPropagation();
          if(!isAdmin()) return;
          currentCard = editBtn.getAttribute('data-card');
          cardTitle.textContent = getTextEl('name' + currentCard).textContent + ' 카드 수정';
          cardTag.value = getTextEl('tag' + currentCard).textContent;
          cardName.value = getTextEl('name' + currentCard).textContent;
          cardDesc.value = getTextEl('desc' + currentCard).textContent;
          cardArrow.value = getTextEl('arrow' + currentCard).textContent;
          
          var linkEl = document.getElementById('cardLink' + currentCard);
          cardUrl.value = linkEl ? (linkEl.getAttribute('href') || '') : '';

          cardOverlay.classList.add('open');
          cardTag.focus();
        }
      });

      function closeCardModal(){ cardOverlay.classList.remove('open'); currentCard = null; }
      cardCancel.addEventListener('click', closeCardModal);
      
      cardSave.addEventListener('click', function(){
        if(!isAdmin() || !currentCard) return;
        var map = {};
        
        // 텍스트 저장
        var pairs = [
          ['tag' + currentCard, cardTag.value.trim()],
          ['name' + currentCard, cardName.value.trim()],
          ['desc' + currentCard, cardDesc.value.trim()],
          ['arrow' + currentCard, cardArrow.value.trim()]
        ];
        pairs.forEach(function(p){
          if(p[1].length === 0) return;
          var el = getTextEl(p[0]);
          if(el) { el.textContent = p[1]; }
          map[p[0]] = p[1];
        });

        // URL 저장
        var urlValue = cardUrl.value.trim();
        if(urlValue.length > 0) {
          var linkEl = document.getElementById('cardLink' + currentCard);
          if(linkEl) {
            // "http://" 나 "https://" 로 시작하지 않으면 자동으로 붙여주는 편의 로직 (선택사항)
            if(!urlValue.startsWith('http://') && !urlValue.startsWith('https://')) {
              urlValue = 'https://' + urlValue;
            }
            linkEl.href = urlValue;
            map['url' + currentCard] = urlValue;
          }
        }

        fsSave(map);
        closeCardModal();
      });
      cardOverlay.addEventListener('click', function(e){ if(e.target === cardOverlay) closeCardModal(); });


      /* ---------------- 공통 단축키 ---------------- */
      document.addEventListener('keydown', function(e){
        if(e.key !== 'Escape') return;
        if(lineOverlay.classList.contains('open')) closeLineModal();
        if(cardOverlay.classList.contains('open')) closeCardModal();
      });

      /* ---------------- Firebase 인증 & Firestore 저장소 ---------------- */
      var firebaseConfig = {
        apiKey: "AIzaSyCBSaHe11LVv-bQ4e8yf0jEWquVjwTcJi8",
        authDomain: "my-tools-5f8ac.firebaseapp.com",
        projectId: "my-tools-5f8ac",
        storageBucket: "my-tools-5f8ac.firebasestorage.app",
        messagingSenderId: "188948905294",
        appId: "1:188948905294:web:4b7f0d2502910fdeaf721f",
        measurementId: "G-93EWWWBQMY"
      };
      firebase.initializeApp(firebaseConfig);
      var fbAuth = firebase.auth();
      var fbDb = firebase.firestore();

      /* 로그인 가능한 관리자 계정 (이 계정으로만 편집 가능) */
      var ADMIN_EMAIL = 'hih100930@gmail.com';
      var FS_COLLECTION = 'mytools_admin_data';
      var FS_DOC_ID = 'main';

      var fsUnsub = null;
      var fsApplyingRemote = false;

      function fsDocRef(){
        return fbDb.collection(FS_COLLECTION).doc(FS_DOC_ID);
      }

      // 관리자로 로그인되어 있고, 화면도 admin-mode 상태일 때만 true
      function isAdmin(){
        var u = fbAuth.currentUser;
        return !!(u && u.email === ADMIN_EMAIL && document.body.classList.contains('admin-mode'));
      }

      function setAdminMode(on){
        document.body.classList.toggle('admin-mode', !!on);
      }

      function showLoggedOutUI(){
        var loginBtn = document.getElementById('googleLoginBtn');
        loginBtn.style.display = '';
        loginBtn.disabled = false;
        document.getElementById('googleLoginBtnLabel').textContent = '관리자 로그인';
        document.getElementById('userBadge').style.display = 'none';
      }
      function showLoggedInUI(user){
        document.getElementById('googleLoginBtn').style.display = 'none';
        document.getElementById('userBadge').style.display = 'flex';
        document.getElementById('userBadgeEmail').textContent = user.email;
      }

      document.getElementById('googleLoginBtn').addEventListener('click', function(){
        var btn = document.getElementById('googleLoginBtn');
        btn.disabled = true;
        document.getElementById('googleLoginBtnLabel').textContent = '로그인 중...';
        var provider = new firebase.auth.GoogleAuthProvider();
        fbAuth.signInWithPopup(provider).catch(function(e){
          console.error(e);
          alert('로그인에 실패했습니다. 다시 시도해주세요.');
          showLoggedOutUI();
        });
      });

      document.getElementById('logoutBtn').addEventListener('click', function(){
        if(confirm('로그아웃 하시겠습니까?')) fbAuth.signOut();
      });

      // Firestore에 저장된 값으로 화면을 덮어씀 (기본값 위에 저장된 값만 얹는 방식)
      function applyRemoteData(data){
        fsApplyingRemote = true;
        resetToDefaults();

        // 저장된 카드 개수만큼 카드 DOM 추가 생성
        if(data.cardCount && parseInt(data.cardCount) > DEFAULT_TOTAL_CARDS){
          totalCards = parseInt(data.cardCount);
          for(var i = DEFAULT_TOTAL_CARDS + 1; i <= totalCards; i++){
            var newCard = createCardElement(i);
            grid.insertBefore(newCard, addCardBtn);
          }
        }

        // 텍스트 전체 덮어쓰기 (새로 생성된 카드 포함)
        var textEls = document.querySelectorAll('[data-key]');
        textEls.forEach(function(el){
          var key = el.getAttribute('data-key');
          if(data[key] !== undefined){ el.textContent = data[key]; }
        });

        // URL 전체 덮어쓰기
        for(var j = 1; j <= totalCards; j++){
          if(data['url' + j]){
            var linkEl = document.getElementById('cardLink' + j);
            if(linkEl) linkEl.href = data['url' + j];
          }
        }
        fsApplyingRemote = false;
      }

      async function fsLoadOnce(){
        try{
          var snap = await fsDocRef().get();
          if(snap.exists){ applyRemoteData(snap.data() || {}); }
        }catch(e){ console.error('Firestore 로드 실패', e); }
      }

      function fsListen(){
        fsUnsub = fsDocRef().onSnapshot(function(doc){
          if(!doc.exists) return;
          applyRemoteData(doc.data() || {});
        }, function(err){ console.error('Firestore 동기화 오류', err); });
      }

      // 관리자 로그인 상태에서만 Firestore에 저장 (merge)
      function fsSave(map){
        if(!isAdmin() || fsApplyingRemote) return;
        fsDocRef().set(map, { merge: true }).catch(function(e){
          console.error('Firestore 저장 실패', e);
          var reason = (e && e.code === 'permission-denied')
            ? 'Firestore 보안 규칙이 저장을 막고 있습니다. Firebase 콘솔에서 규칙을 확인해주세요.'
            : ('오류: ' + (e && e.message ? e.message : e));
          alert('저장에 실패했습니다.\n' + reason);
        });
      }

      fbAuth.onAuthStateChanged(async function(user){
        if(fsUnsub){ fsUnsub(); fsUnsub = null; }
        if(!user){
          setAdminMode(false);
          showLoggedOutUI();
          resetToDefaults(); // 로그아웃 시 코드에 저장된 기본값으로 복원
          return;
        }
        if(user.email !== ADMIN_EMAIL){
          alert('관리자 계정(' + ADMIN_EMAIL + ')으로만 로그인할 수 있습니다.');
          await fbAuth.signOut();
          return;
        }
        showLoggedInUI(user);
        setAdminMode(true);
        await fsLoadOnce();
        fsListen();
      });
    })();
  </script>
</body>
</html>
